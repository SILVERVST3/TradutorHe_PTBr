name: Compilar APK

on:
  push:
  workflow_dispatch:

env:
  SHERPA_VERSION: "2.0.1"
  LLAMA_TAG: "b12059"
  ASR_DIR: "zipformer2-66m-streaming-he"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Biblioteca sherpa-onnx (reconhecimento de voz)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx-${SHERPA_VERSION}.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar

      - name: Modelo de voz em hebraico (ivrit.ai Zipformer2, embutido no APK)
        run: |
          d=app/src/main/assets/$ASR_DIR
          mkdir -p $d
          for f in encoder.int8.onnx decoder.int8.onnx joiner.int8.onnx tokens.txt; do
            curl -fL --retry 3 -o $d/$f \
              https://huggingface.co/thewh1teagle/zipformer2-66m-streaming-he/resolve/main/sherpa-onnx/$f \
            || curl -fL --retry 3 -o $d/$f \
              https://github.com/Jonathan-Asher/codeg-ios/releases/download/models-v2/zipformer2-66m-streaming-he-$f
          done
          ls -la $d

      - name: llama.cpp (motor do tradutor HY-MT)
        run: |
          rm -rf app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch ${LLAMA_TAG} https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Erros de compilação (se houver)
        if: failure()
        run: grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80 || true

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk TradutorHE-PT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TradutorHE-PT-apk
          path: TradutorHE-PT.apk
          compression-level: 0
